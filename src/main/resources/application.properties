# Base de datos compartida con tecs-admin (las tablas las crean las migraciones de Django)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tecsite?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

server.port=${PORT:8090}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
